
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3-Tier 방명록</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      color: #222;
    }
    h1 { text-align: center; }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px #00000010;
    }
    input, textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      font: inherit;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .entry {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }
    .entry p { white-space: pre-wrap; }
    .date { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h1>3-Tier 방명록</h1>
  <p style="text-align:center">
    Nginx → Flask API → MariaDB
  </p>

  <div class="card">
    <h2>글 작성</h2>
    <form id="form">
      <input id="name" placeholder="작성자 이름"
             maxlength="50" required>
      <textarea id="message" placeholder="메시지"
                maxlength="1000" required></textarea>
      <button id="submit" type="submit">등록하기</button>
    </form>
    <p id="status" role="status"></p>
  </div>

  <div class="card">
    <h2>최근 메시지</h2>
    <div id="entries">불러오는 중...</div>
  </div>

  <script>
    const form = document.getElementById("form");
    const list = document.getElementById("entries");
    const status = document.getElementById("status");
    const button = document.getElementById("submit");

    async function loadEntries() {
      const res = await fetch("/api/guestbook");
      if (!res.ok) throw new Error("목록 조회 실패");

      const data = await res.json();
      list.replaceChildren();

      if (data.length === 0) {
        list.textContent = "아직 방명록이 없습니다.";
        return;
      }

      data.forEach(entry => {
        const item = document.createElement("div");
        item.className = "entry";

        const name = document.createElement("strong");
        name.textContent = entry.name;

        const date = document.createElement("div");
        date.className = "date";
        date.textContent = entry.created_at;

        const message = document.createElement("p");
        message.textContent = entry.message;

        item.append(name, date, message);
        list.appendChild(item);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;

      try {
        const res = await fetch("/api/guestbook", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            message: document.getElementById("message").value
          })
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || "등록 실패");
        }

        form.reset();
        await loadEntries();
        status.textContent = "방명록 등록 성공!";

      } catch (error) {
        status.textContent = error.message;

      } finally {
        button.disabled = false;
      }
    });

    loadEntries().catch(error => {
      list.textContent = error.message;
    });
  </script>
</body>
</html>
