
name: Build and Deploy Flask Guestbook

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. CI: Docker 이미지 빌드 및 업로드
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-guestbook:latest

  # 2. CD: Kakao Cloud 자동 배포
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to Kakao Cloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/flask-guestbook:latest"

            echo "1. 최신 Docker 이미지 다운로드"
            docker pull "$IMAGE"

            echo "2. 기존 방명록 컨테이너 제거"
            docker rm -f guestbook 2>/dev/null || true

            echo "3. 새 컨테이너 실행"
            docker run -d \
              --name guestbook \
              --restart unless-stopped \
              -p 80:5000 \
              "$IMAGE"

            echo "4. 컨테이너 확인"
            docker ps --filter name=guestbook

            echo "5. HTTP 응답 검증"
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1/ > /dev/null; then
                echo "배포 성공!"
                exit 0
              fi
              sleep 2
            done

            echo "배포 검증 실패"
            docker logs guestbook
            exit 1

